"Outcome of an authorization-sensitive audited operation."
enum AuditOutcome {
    ALLOWED
    DENIED
}

"Stable Version 1 action vocabulary for protected organization operations."
enum AuditAction {
    CREATE_ORGANIZATION
    VIEW_ORGANIZATION
    MANAGE_ORGANIZATION
    VIEW_SETTINGS
    MANAGE_SETTINGS
    MANAGE_MEMBERSHIPS
    VIEW_AUDIT
    VIEW_PATIENTS
    MANAGE_PATIENTS
    REVIEW_PATIENT_MERGES
    REGISTER_PATIENT
    REQUEST_PATIENT_MERGE_REVIEW
    VIEW_CONSENTS
    MANAGE_CONSENTS
    BREAK_GLASS_PATIENT_ACCESS
    GRANT_PATIENT_CONSENT
    REVOKE_PATIENT_CONSENT
    PRIVACY_DECISION
    ACTIVATE_BREAK_GLASS
    VIEW_SCHEDULE
    MANAGE_SCHEDULE
    MANAGE_SCHEDULING_CONFIGURATION
    BOOK_APPOINTMENT
    RESCHEDULE_APPOINTMENT
    CANCEL_APPOINTMENT
    JOIN_WAITLIST
    CANCEL_WAITLIST
    VIEW_ENCOUNTERS
    MANAGE_ENCOUNTERS
    CREATE_ENCOUNTER
    ARRIVE_ENCOUNTER
    START_ENCOUNTER
    COMPLETE_ENCOUNTER
    CANCEL_ENCOUNTER
    VIEW_CLINICAL_RECORD
    MANAGE_CLINICAL_RECORD
    RECORD_PROBLEM
    UPDATE_PROBLEM_STATUS
    RECORD_ALLERGY
    RECORD_OBSERVATION
    CREATE_CLINICAL_NOTE
    UPDATE_CLINICAL_NOTE_DRAFT
    SIGN_CLINICAL_NOTE
    ADD_CLINICAL_NOTE_ADDENDUM
    CORRECT_CLINICAL_NOTE
}

"Generic resource classification kept independent from country-specific identifiers."
enum AuditResourceType {
    ORGANIZATION
    FACILITY
    OPERATIONAL_SETTINGS
    ORGANIZATION_MEMBERSHIP
    AUDIT_EVENT
    PATIENT
    PATIENT_MERGE_REVIEW
    PATIENT_CONSENT
    PRIVACY_DECISION
    BREAK_GLASS_ACCESS
    APPOINTMENT
    SCHEDULING_RESOURCE
    APPOINTMENT_TYPE
    WAITLIST_ENTRY
    ENCOUNTER
    CLINICAL_RECORD
    CLINICAL_PROBLEM
    PATIENT_ALLERGY
    CLINICAL_OBSERVATION
    CLINICAL_NOTE
}

"Append-oriented evidence for a protected operation or security-relevant denial."
type AuditEvent {
    id: ID!
    actorUserId: ID
    organizationId: ID
    facilityId: ID
    patientId: ID
    resourceType: AuditResourceType!
    resourceId: ID
    action: AuditAction!
    outcome: AuditOutcome!
    correlationId: String!
    occurredAt: String!
}

input AuditEventsInput {
    organizationId: ID!
    limit: Int = 50
}

extend type Query {
    auditEvents(input: AuditEventsInput!): [AuditEvent!]!
        @guard
        @field(resolver: "App\\GraphQL\\Queries\\AuditEventsQuery")
}
