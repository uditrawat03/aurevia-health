name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Laravel
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/api/composer.json') != '' }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aurevia_health_test
          POSTGRES_USER: aurevia_health
          POSTGRES_PASSWORD: aurevia_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurevia_health -d aurevia_health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=aurevia_health_test"
            echo "DB_USERNAME=aurevia_health"
            echo "DB_PASSWORD=aurevia_health"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
          } >> .env

      - name: Migrate
        run: php artisan migrate --force

      - name: Test
        run: php artisan test

  frontend:
    name: Angular
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/web/package.json') != '' }}

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build
